<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eklavya Mirani</title>
  <meta name="description" content="Fingerboard Coach: real-time intonation and rhythm coaching for violin.">
  <meta name="color-scheme" content="dark light">
  <style>
    :root { --bg: #0d1016; --surface: #161b24; --line: #242b37; --text: #e7eaf0; --muted: #9aa3b2; --accent: #f2a65a; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fbfaf7; --surface: #fff; --line: #e3dfd6; --text: #15181e; --muted: #5d6573; --accent: #b85f12; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a.card {
      display: block; max-width: 520px; padding: 28px; border: 1px solid var(--line); border-radius: 14px;
      background: var(--surface); color: inherit; text-decoration: none; transition: border-color .15s;
    }
    a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
    h1 { margin: 0 0 6px; font-size: 1.4rem; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); }
    span { display: inline-block; margin-top: 16px; color: var(--accent); font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <a class="card" href="/violin-practice-system/">
      <h1>Fingerboard Coach</h1>
      <p>Real-time intonation and rhythm coaching for violin. It listens while you play and scores every note on pitch, timing and shifts.</p>
      <span>Open →</span>
    </a>
  </main>
</body>
</html>
